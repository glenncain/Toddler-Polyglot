plugins { id 'com.android.application' }

android {
    namespace 'com.msb.elevenminutes'
    compileSdk 34

    defaultConfig {
        applicationId "com.msb.elevenminutes"
        minSdk 24                 // Android 7.0 — the oldest tablet worth putting this on
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false   // the whole app is one HTML asset; nothing to shrink
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module']
    }
}

dependencies {
    // Kotlin 1.8 folded jdk7/jdk8 into the main stdlib, but some androidx artifacts still
    // ask for the old split jars, which duplicates every class in them and fails
    // checkDebugDuplicateClasses. HANDOFF.md said this fix was already here; it was not —
    // it was sitting in the root build.gradle, where it applied to nothing.
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'avoid duplicate classes with kotlin-stdlib 1.8+'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'avoid duplicate classes with kotlin-stdlib 1.8+'
        }
    }

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.core:core:1.13.1'
}
