name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the project tree from the flat upload
        run: |
          set -e
          # the two build.gradle files are told apart by content, not by name
          for f in "build.gradle" "build (1).gradle"; do
            [ -f "$f" ] || continue
            if grep -q "apply false" "$f"; then cp "$f" /tmp/root.gradle; else cp "$f" /tmp/app.gradle; fi
          done
          rm -f "build.gradle" "build (1).gradle" download

          mkdir -p app/src/main/java/com/msb/elevenminutes \
                   app/src/main/res/values app/src/main/res/xml \
                   app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 \
                   app/src/main/assets gradle/wrapper

          mv AndroidManifest.xml            app/src/main/
          mv Bridge.java MainActivity.java  app/src/main/java/com/msb/elevenminutes/
          mv index.html                     app/src/main/assets/
          mv strings.xml themes.xml colors.xml        app/src/main/res/values/
          mv backup_rules.xml data_extraction_rules.xml app/src/main/res/xml/
          mv ic_launcher_foreground.xml     app/src/main/res/drawable/
          mv ic_launcher.xml                app/src/main/res/mipmap-anydpi-v26/
          mv gradle-wrapper.properties      gradle/wrapper/
          mv proguard-rules.pro             app/
          cp /tmp/app.gradle                app/build.gradle
          cp /tmp/root.gradle               build.gradle

          echo "--- tree ---"
          find . -path ./.git -prune -o -type f -print | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect the APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: eleven-minutes-apk
          path: out/*.apk
          if-no-files-found: error
