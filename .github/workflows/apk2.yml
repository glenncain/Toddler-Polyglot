name: APK v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Lay out the project
        run: |
          set -e
          mvif() { [ -f "$1" ] && mv "$1" "$2" || true; }
          rm -f build.gradle "build (1).gradle" download build-apk.yml

          mkdir -p app/src/main/java/com/msb/elevenminutes \
                   app/src/main/res/values app/src/main/res/xml \
                   app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 \
                   app/src/main/assets

          mvif AndroidManifest.xml app/src/main/
          mvif Bridge.java         app/src/main/java/com/msb/elevenminutes/
          mvif MainActivity.java   app/src/main/java/com/msb/elevenminutes/
          mvif index.html          app/src/main/assets/
          mvif strings.xml         app/src/main/res/values/
          mvif themes.xml          app/src/main/res/values/
          mvif colors.xml          app/src/main/res/values/
          mvif backup_rules.xml    app/src/main/res/xml/
          mvif data_extraction_rules.xml   app/src/main/res/xml/
          mvif ic_launcher_foreground.xml  app/src/main/res/drawable/
          mvif ic_launcher.xml     app/src/main/res/mipmap-anydpi-v26/
          mvif proguard-rules.pro  app/

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ElevenMinutes"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.msb.elevenminutes'
              compileSdk 34
              defaultConfig {
                  applicationId "com.msb.elevenminutes"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              constraints {
                  implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') { because 'dupes' }
                  implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') { because 'dupes' }
              }
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity:1.9.2'
              implementation 'androidx.core:core:1.13.1'
          }
          EOF
          python3 - <<'PY'
          p = "app/src/main/assets/index.html"
          s = open(p).read()
          s = s.replace(
            'catch(e){ DIAG.mic="denied"; paintDiag(); }',
            'catch(e){ DIAG.mic="denied"; DIAG.micErr=(e&&e.name?e.name:"?")+" / "+location.protocol; paintDiag(); }')
          s = s.replace(
            '"Grant the microphone in system settings, then run this again." :',
            '("Blocked ["+(DIAG.micErr||"?")+"]. Grant the microphone in system settings, then run this again.") :')
          open(p, "w").write(s)
          print("diagnostic patched in")
          PY
          find . -path ./.git -prune -o -type f -print | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - run: gradle wrapper --gradle-version 8.7 --no-daemon

      - run: ./gradlew assembleDebug --no-daemon

      - run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: eleven-minutes-apk
          path: out/*.apk
