      - name: Rebuild the project tree from the flat upload
        run: |
          set -e
          rm -f build.gradle "build (1).gradle" download

          mkdir -p app/src/main/java/com/msb/elevenminutes \
                   app/src/main/res/values app/src/main/res/xml \
                   app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26 \
                   app/src/main/assets gradle/wrapper

          mv AndroidManifest.xml            app/src/main/
          mv Bridge.java MainActivity.java  app/src/main/java/com/msb/elevenminutes/
          mv index.html                     app/src/main/assets/
          mv strings.xml themes.xml colors.xml           app/src/main/res/values/
          mv backup_rules.xml data_extraction_rules.xml  app/src/main/res/xml/
          mv ic_launcher_foreground.xml     app/src/main/res/drawable/
          mv ic_launcher.xml                app/src/main/res/mipmap-anydpi-v26/
          mv gradle-wrapper.properties      gradle/wrapper/
          mv proguard-rules.pro             app/

          cat > build.gradle <<'ROOT'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          ROOT

          cat > app/build.gradle <<'APP'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.msb.elevenminutes'
              compileSdk 34

              defaultConfig {
                  applicationId "com.msb.elevenminutes"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      applicationIdSuffix ".debug"
                      versionNameSuffix "-debug"
                  }
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              // Kotlin 1.8+ folded jdk7/jdk8 into the main stdlib; some androidx
              // artifacts still ask for the old split jars, duplicating every class.
              constraints {
                  implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') { because 'duplicate classes' }
                  implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') { because 'duplicate classes' }
              }
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity:1.9.2'
              implementation 'androidx.core:core:1.13.1'
          }
          APP

          echo "--- tree ---"
          find . -path ./.git -prune -o -type f -print | sort
